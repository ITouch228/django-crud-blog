[project]
name = "django-crud-blog"
version = "1.0.0"
description = "Django CRUD blog with email auth and draft/publish workflow"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".git", ".venv", "__pycache__", "migrations", "manage.py"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "N",    # pep8-naming
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["blog", "accounts", "blog_project"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"